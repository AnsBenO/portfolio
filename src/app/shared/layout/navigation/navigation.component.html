<mat-drawer-container class="min-h-0 bg-transparent" autosize>
      <mat-drawer #drawer mode="over" position="end" class="glass-drawer w-72 border-0">
            <nav aria-label="Mobile navigation" class="flex h-full flex-col gap-2 p-4">
                  @for (link of navLinks; track link.id) {
                  <a [attr.href]="'#' + link.id" (click)="$event.preventDefault(); scrollToSection(link.id, drawer)"
                        [class.nav-link-active]="isActive(link.id)" class="nav-link">
                        {{ link.label }}
                  </a>
                  }
                  <div class="mt-4 border-t border-[rgba(var(--border-rgb),0.28)] pt-4 flex justify-center">
                        <ui-theme-toggle [compact]="true"></ui-theme-toggle>
                  </div>
            </nav>
      </mat-drawer>

      <mat-drawer-content class="bg-transparent">
            <header class="sticky top-0 z-40 pb-4 pt-2 md:hidden">
                  <div
                        class="glass-panel nav-shell mx-auto flex w-full max-w-6xl items-center justify-between gap-4 rounded-2xl px-4 py-3 sm:px-6">
                        <a href="#home" (click)="$event.preventDefault(); scrollToSection('home')"
                              class="flex items-center gap-3">
                              <span
                                    class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-[rgba(var(--brand-rgb),0.24)] text-sm font-semibold text-[hsl(var(--text-1))]">
                                    {{ brandInitials() }}
                              </span>
                              <div>
                                    <p class="m-0 text-sm font-semibold tracking-tight text-[hsl(var(--text-1))]">{{
                                          basics()?.name ?? 'Portfolio' }}</p>
                                    <p class="m-0 text-xs text-[hsl(var(--text-2))]">{{ basics()?.role ?? 'Role' }}</p>
                              </div>
                        </a>
                        <div class="flex items-center gap-2">
                              <button mat-icon-button class="glass-ghost-button" (click)="drawer.toggle()"
                                    aria-label="Open navigation menu">
                                    <mat-icon>menu</mat-icon>
                              </button>
                        </div>
                  </div>
            </header>

            <aside aria-label="Primary navigation"
                  class="side-rail glass-panel fixed left-5 top-1/2 -translate-y-1/2 z-40 hidden w-20 flex-col items-center gap-3 rounded-2xl py-3 md:flex">
                  <a href="#home" (click)="$event.preventDefault(); scrollToSection('home')" class="rail-logo"
                        title="Home">
                        {{ brandInitials() }}
                  </a>
                  <ui-theme-toggle [compact]="true"></ui-theme-toggle>
                  <div class="h-px w-11 bg-[rgba(var(--border-rgb),0.35)]"></div>
                  <nav aria-label="Desktop navigation" class="flex w-full flex-col items-center gap-1 px-2">
                        @for (link of navLinks; track link.id) {
                        <a [attr.href]="'#' + link.id" (click)="$event.preventDefault(); scrollToSection(link.id)"
                              [class.rail-link-active]="isActive(link.id)" class="rail-link"
                              [attr.aria-label]="link.label" [attr.title]="link.label">
                              <mat-icon>{{ link.icon }}</mat-icon>
                              <span class="rail-link-label">{{ link.label }}</span>
                        </a>
                        }
                  </nav>
            </aside>
      </mat-drawer-content>
</mat-drawer-container>
