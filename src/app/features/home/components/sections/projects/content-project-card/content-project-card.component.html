<div class="group relative flex min-h-90 md:min-w-100 cursor-pointer flex-col overflow-hidden
     border border-border-rgb
     bg-surface-1/55
     backdrop-blur-2xl
     transition-all duration-500
     hover:-translate-y-2
     hover:border-brand-2
     hover:shadow-[0_0_0_1px_rgb(var(--brand-rgb))]
     hover:shadow-[rgb(var(--brand-rgb)/0.18)]"
     (click)="goToSource()">

      <!-- Image -->
      <img [src]="project().thumbnailUrl" [alt]="project().title" class="absolute inset-0 h-full w-full object-cover object-center
           transition-all duration-700
           group-hover:scale-105
           group-hover:brightness-110
           group-hover:saturate-125" />

      <!-- Soft vignette -->
      <div class="absolute inset-0 bg-black/10"></div>

      <!-- Hover glow -->
      <div class="absolute inset-0 opacity-0 transition-opacity duration-500
           group-hover:opacity-100
           bg-linear-to-br
           from-[rgb(var(--brand-rgb)/0.18)]
           via-transparent
           to-[rgb(var(--brand-rgb)/0.08)]">
      </div>


      <!-- Glass content panel -->
     <div class="relative z-20 mt-auto
            border-t border-border-1/25
            bg-surface-1/75 dark:bg-surface-1/75
            backdrop-blur-xl
            p-6">

            <div class="flex items-start justify-between gap-4">

                  <div class="min-w-0 flex-1">

                        <h3 class="text-xl font-bold tracking-tight
                        text-text-1
                        transition-colors duration-300
                        group-hover:text-brand-2">
                        {{ project().title }}
                        </h3>
                        <p class="mt-3 line-clamp-2 text-sm leading-6
                 text-[hsl(var(--text-2))]">
                              {{ project().description }}
                        </p>

                  </div>

                  <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full
               border border-[hsl(var(--border-1)/0.35)]
               bg-[hsl(var(--surface-2)/0.6)]
               backdrop-blur-md
               transition-all duration-300
               group-hover:-translate-y-1
               group-hover:translate-x-1
               group-hover:border-[hsl(var(--brand-1)/0.45)]
               group-hover:bg-[rgb(var(--brand-rgb)/0.15)]">

                        <mat-icon class="text-[20px] text-[hsl(var(--text-1))]
           transition-colors duration-300
           group-hover:text-[hsl(var(--brand-1))]">
                              north_east
                        </mat-icon>

                  </div>

            </div>

            <div class="mt-5 flex flex-wrap gap-2">
                  @for (tech of project().technologies; track $index) {
                  <ui-technology-chip [label]="tech" />
                  }
            </div>

            <div class="mt-6 flex items-center justify-between
             border-t border-[hsl(var(--border-1)/0.25)]
             pt-4">

                  <span class="text-xs font-medium uppercase
               text-[hsl(var(--text-2))]">
                        Personal Project
                  </span>

                  <!-- <span class="text-xs text-[hsl(var(--text-2))]">
                        2026
                  </span> -->

            </div>

      </div>

</div>
