<section id="home" class="section-screen section-anchor">
      <div class="grid gap-5 xl:grid-cols-[0.43fr_0.57fr]">
            <ui-glass-card padding="md" radius="3xl">
                  <article class="overflow-hidden rounded-[1.4rem] bg-[rgba(var(--surface-strong-rgb),0.34)]">
                        <div class="profile-photo-wrap relative h-64 overflow-hidden">
                              <div class="profile-photo-gradient absolute inset-0"></div>
                              <div
                                    class="absolute inset-0 flex items-end justify-center bg-[radial-gradient(circle_at_50%_8%,rgba(var(--brand-rgb),0.18),transparent_56%)]">
                                    <img src="profile-pic.png" alt="Profile portrait" class="profile-picture" />
                              </div>
                              <div
                                    class="absolute -bottom-8 left-1/2 h-18 w-[130%] -translate-x-1/2 rounded-[50%] bg-[hsl(var(--surface-1))]">
                              </div>
                        </div>

                        <div class="px-5 pb-6 pt-6 text-center sm:px-7">
                              <h1
                                    class="mt-2 text-3xl font-semibold tracking-tight text-[hsl(var(--text-1))] sm:text-4xl">
                                    {{ basics()?.name ?? 'Portfolio' }}
                              </h1>
                              <p class="eyebrow">{{ basics()?.role ?? 'Role' }}</p>

                              <div class="mt-5 flex items-center justify-center gap-3">
                                    <ui-icon-button ariaLabel="Send email" size="md" [link]="mailLink()"
                                          [external]="true" icon="mail"></ui-icon-button>
                                    @for (profile of profiles(); track profile.url) {
                                    <ui-icon-button [ariaLabel]="'Open ' + profile.network + ' profile'" size="md"
                                          [link]="profile.url" [external]="true" [svgIcon]="svgIconForProfile(profile)"
                                          [icon]="fallbackIconForProfile(profile)"></ui-icon-button>
                                    }
                              </div>
                        </div>
                  </article>
            </ui-glass-card>

            <ui-glass-card padding="lg" radius="3xl">
                  <ui-stack gap="6">
                        <div>
                              <p class="eyebrow">Quick Intro</p>
                              <h2
                                    class="mt-1 text-2xl font-semibold tracking-tight text-[hsl(var(--text-1))] sm:text-3xl">
                                    End-to-end development, product-first thinking
                              </h2>
                        </div>

                        <p class="text-sm leading-relaxed text-[hsl(var(--text-2))] sm:text-base">
                              {{ basics()?.summary ?? 'Profile summary loading...' }}
                        </p>

                        <div class="flex flex-wrap gap-2">
                              <ui-button variant="primary" link="#experience">
                                    <mat-icon class="text-base">timeline</mat-icon>
                                    View Experience
                              </ui-button>
                              <ui-button variant="secondary" link="#contact">
                                    <mat-icon class="text-base">alternate_email</mat-icon>
                                    Let's Connect
                              </ui-button>
                        </div>
                  </ui-stack>
            </ui-glass-card>
      </div>
</section>
